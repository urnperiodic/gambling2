name: Build, Test & Deploy Velvet Originals Casino

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-ci-${{ github.ref }}'
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify-and-build:
    name: Lint, Unit Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install || npm install --legacy-peer-deps

      - name: Run TypeScript typecheck (lint)
        run: npm run lint

      - name: Run unit test suite
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Add .nojekyll to dist
        run: touch ./dist/.nojekyll

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-bundle
          path: ./dist
          if-no-files-found: error

      - name: Configure GitHub Pages
        id: configure_pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/configure-pages@v5
        with:
          enablement: true
        continue-on-error: true

      - name: Upload Pages artifact
        id: upload_pages
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
        continue-on-error: true

  deploy:
    name: Deploy to GitHub Pages
    needs: verify-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-bundle
          path: ./dist
        continue-on-error: true

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
        continue-on-error: true

      - name: Deploy to GitHub Pages (Actions environment)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Deployment Summary
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "Deployed to GitHub Pages via Actions: ${{ steps.deployment.outputs.page_url }}"
          else
            echo "Build published to gh-pages branch. To serve live on GitHub Pages, go to Settings -> Pages and select either 'GitHub Actions' or the 'gh-pages' branch."
          fi
